[package]
name = "desktop"
version = "0.1.0"
description = "Vision Hub -- a desktop order-flow overlay for gold futures"
authors = ["Vision Hub"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes `transparent: true` actually transparent on
# macOS; without it the window silently stays opaque and `tauri.conf.json`'s
# `macOSPrivateApi` fails the build rather than degrading quietly.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
# Feed credentials go to the OS keychain and nowhere else (W3D1: "never
# plaintext on disk, never to our servers"). Native backends only -- the
# crate's file-based fallbacks are exactly the plaintext-on-disk this exists
# to rule out, so they are not enabled.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }


[project]
name = "signal-data"
version = "0.1.0"
description = "GC tick pulls, delta/CVD, and the strategy-selector backtest harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databento>=0.71.0",
    "matplotlib>=3.10.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

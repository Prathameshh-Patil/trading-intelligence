# Track C -- every parameter the engine reads, and the decision that set it.
#
# THE RULE THIS FILE EXISTS TO ENFORCE. Not one number here was fitted, chosen
# after seeing a backtest, or tuned. Each is either (a) restated from
# `mathematical.md`/`docs/strategy/TRACK_C_ENGINE.md`, (b) a round number
# pre-committed before the first run, or (c) a structural bound. The comment on
# each line says which. A parameter whose comment is "it worked better" is a
# parameter this file rejects -- change the comment and the number stops being
# defensible, which is the point of writing them side by side.
#
# ⚠️ UNITS. `_usd` is USD per ounce. `_atr` is a multiple of ATR (USD/oz).
# `_bp` is basis points of price (1e-4). `_bars` counts bars at `[data].bar`.
# A ratio has no suffix. Nothing here is in ticks: XAUUSD's `tick` is
# Dukascopy's 0.001 price quantum and `instruments.py` forbids costing in it.

[meta]
committed = "2026-09-18"       # gates and thresholds pre-committed before run 1
spec = "docs/strategy/TRACK_C_ENGINE.md"

[data]
bar = "5min"                   # user decision 2026-09-18: 5-minute is the trading resolution
audit_bar = "1min"             # ... and 1-minute exists only to audit what 5-minute cannot resolve
symbol = "XAUUSD"

# --------------------------------------------------------------------------
# Risk. §10/§11, restated. These are REFUSALS, never sizing adjustments: a
# rule that can be satisfied by shrinking is a rule someone shrinks to zero.

[risk]
equity_usd = 100000.0          # declared account size; every R and every lot count scales off it
risk_fraction = 0.004          # §11: "should default to 0.4%, not 0.7%"
value_per_lot = 100.0          # $100 per $1.00/oz -- a 100-ounce standard lot
# §10's 20-50 ticks, held as ATR multiples rather than dollars (2026-09-19).
# The dollars were a fact about GC in 2025: run on spot at ~$4,175 the $5 cap
# refused ~90% of everything that reached it while the $2 floor refused nothing
# at all, because the median 60-minute ATR there is $4.53. Measured on six
# months of 2025 GC -- the instrument §10 was written for -- the median ATR is
# $2.56, so the spec's own numbers are 0.78x and 1.95x ATR. These are those,
# rounded. BOTH bounds are enforced -- see TRACK_C_ENGINE §2.1.
d_min_atr = 0.8                # §10's 20 ticks, as GC measured them
d_max_atr = 2.0                # §10's 50 ticks, as GC measured them
r_multiple = 2.5               # §10: R = clip(2.5D, floor, cap)
be_at_r = 1.5                  # §10: stop to break-even once the trade is 1.5D in favour
max_trades_per_day = 2         # §11
max_losses_per_day = 2         # §11
daily_loss_cap_usd = 1100.0    # §11's min($1100, 0.75 x DLL_firm) with no firm chosen -- PLACEHOLDER
dll_firm_usd = 0.0             # 0 = no prop firm selected. Every report header must say so
limit_life_s = 20.0            # §9. A limit that does not fill inside its life is CANCELLED,
                               # never converted to market. See `fills.py` on what a 5-min bar
                               # can and cannot say about a 20-second order.

# --------------------------------------------------------------------------
# Cost. Pessimistic by construction -- a strategy that needs better execution
# than this should fail, and that is the correct outcome.

[cost]
slippage_spread_frac = 0.5     # ASSUMPTION: no live trade journal exists. Slippage is modelled as
                               # half the measured spread before the margin below. Stated in every
                               # report header rather than buried here.
slippage_margin = 1.5          # TRACK_C_ENGINE §6.1: 1.5x the estimate, as margin of safety
news_spread_mult = 3.0         # §6.1: spread x3 inside a news window even when the trade is allowed
max_slippage_share = 0.25      # §13's hard exclusion, mirrored from `e3_cost.MAX_SLIPPAGE_SHARE`

[news]
internal_lockout_min = 5       # §12's internal risk lock
hard_lockout_min = 2           # §12's hard event lock

# --------------------------------------------------------------------------
# Regime mathematics. Windows are in bars; at 5-minute bars 12 = 1h, 288 = 24h.

[regime]
atr_window = "60min"           # clock window, not bar count -- spot drops empty minutes
atr_min_bars = 8               # a 60-minute ATR off fewer than 8 bars is an average of a gap
yz_fast_bars = 12              # §2's n = 12 (one hour)
yz_slow_bars = 288             # §2's n = 288 (one day) -- the baseline a "ratio" is a ratio TO
hurst_window_bars = 256        # §6's estimators need 4 windows at the largest scale; 256 gives them
hurst_step_bars = 12           # recomputed hourly and held between. H is a property of a 256-bar
                               # window; recomputing it per bar moves it by less than its own
                               # estimation error and costs ~12x the runtime
hurst_agree_tol = 0.05         # `features.hurst.AGREE_TOL`, restated so it is visible here
pct_lookback_bars = 2880       # 10 trading days -- the trailing sample every percentile ranks against

# --------------------------------------------------------------------------
# Clock. New York local time, half-open windows, per `features/structure.py`.
#
# ⚠️ DELIBERATE DIVERGENCE FROM §1, RECORDED ONCE. §1's active windows are
# 08:00-11:30 and 13:30-15:30 New York, chosen for the §9 expansion event.
# S1 and S2 trade the London open, which §1 excludes -- and an Asian-range
# breakout that may not trigger at the London open is not the strategy. So
# each strategy names its own window and §1's pair is S3's, unchanged.

[session]
asian_start = "20:00"          # Tokyo 09:00 JST, in New York local time; wraps midnight
asian_end = "02:00"            # Tokyo 15:00 JST -- the range is CLOSED and readable from here on

# --------------------------------------------------------------------------
# S1 -- Asian-range breakout with a volatility-expansion gate.
# Regime it is built for: EXPANSION, trending (H > 0.5).

[s1]
windows = [["03:00", "11:30"]]   # London open through the New York morning
# ⚠️ CORRECTED 2026-09-18, BEFORE THE FIRST RUN, AND THE ERROR IS WORTH KEEPING
# VISIBLE. These were 0.5 and 3.0, which compared a SIX-HOUR range against a
# ONE-HOUR ATR -- horizons that differ by a factor of six, so the bound was
# unreachable by construction and `range_width` refused 100% of a synthetic
# archive. Under diffusion a 6-hour range scales as about sqrt(6) ~ 2.4 hourly
# ranges, and a max-minus-min runs ~2-3x the average true range at the same
# horizon, so the neutral expectation is 4-7x ATR_1h; measured on a random walk
# the 1st-99th percentiles are 3.6 and 10.9.
#
# **So this pair is a DEGENERACY GUARD, not a selective filter, and its pass
# rate in the attrition table will be near 1.** That is what it is for: reject
# the day whose Asian session never moved, and the day that already made the
# whole move before London. A filter that looks selective here would be one
# fitted to a distribution nobody has measured on the real archive yet.
range_min_atr = 2.0              # below this the Asian session never moved
range_max_atr = 12.0             # above it, the day's move already happened inside the range
vol_ratio_min = 1.15             # short-horizon vol running 15% hot against its own daily baseline.
                                 # Pre-committed round number, never tuned
hurst_min = 0.50                 # §9 condition 7's persistent leg, at the spec's own boundary
max_extension_atr = 0.75         # chasing: more than 0.75 ATR past the level and the move is gone
entry_pullback_atr = 0.25        # the limit sits BACK toward the level, never at market
stop_pad_atr = 1.00              # a full ATR beyond the broken level -- see the note below

# --------------------------------------------------------------------------
# S2 -- prior-day extreme sweep and reclaim (stop-run reversal).
# Regime it is built for: range, mean-reverting (H < 0.55). Structurally the
# opposite entry to S1: S1 buys the break, S2 buys the failure of the break.

[s2]
windows = [["03:00", "11:30"]]
reclaim_bars = 3                 # §9's reclaim is 30 SECONDS on ticks. At 5-minute bars the
                                 # smallest honest statement is "within 3 bars" -- and that is a
                                 # WEAKER condition than §9's, which the report must say
hurst_max = 0.55                 # a sweep into a trending tape is a continuation, not a reversal
entry_pullback_atr = 0.25
stop_pad_atr = 0.50              # beyond the swept extreme, which is the structure being traded

# --------------------------------------------------------------------------
# S3 -- session-VWAP mean reversion in a low-memory, compressed-vol regime.
# Regime it is built for: CHOP. Fires where S1 and S4 are both forbidden.

[s3]
windows = [["08:00", "11:30"], ["13:30", "15:30"]]   # §1's own pair, unchanged
min_session_bars = 24            # two hours of session before a VWAP means anything
z_min = 2.0                      # the user's spec: |z| > 2
hurst_max = 0.45                 # strictly mean-reverting, not merely "not trending"
vol_ratio_max = 0.90             # compression: short-horizon vol BELOW its daily baseline
time_stop_bars = 24              # two hours. A mean reversion that has not happened is a trend
entry_pullback_atr = 0.25
stop_lookback_bars = 12          # the last hour's extreme is the structure the stop sits behind
stop_pad_atr = 0.50

# --------------------------------------------------------------------------
# S4 -- momentum continuation out of a volatility contraction.
# Regime it is built for: BUILD -> EXPANSION. Differs from S1 in what defines
# the level: S1's is the clock's (the Asian range), S4's is the volatility's
# (a Bollinger squeeze), so the two fire on different days by construction.

[s4]
windows = [["03:00", "11:30"], ["13:30", "15:30"]]
bb_bars = 20                     # Bollinger's own default. Not chosen here, and not tuned
bb_k = 2.0                       # ditto
squeeze_pct_max = 0.20           # width in the bottom fifth of its own 10-day distribution
hurst_min = 0.50
liquidity_pct_min = 0.50         # ASSUMPTION: quote-update count as a liquidity proxy. Spot has no
                                 # traded volume; `spot.py` names the column `ticks` and NOT volume
                                 # precisely so this stays a declared proxy
entry_pullback_atr = 0.25
stop_pad_atr = 0.75              # a squeeze is a narrow thing to hide a stop behind

# ⚠️ THE FOUR `stop_pad_atr` NUMBERS, AND AN HONEST NOTE ABOUT THEM. Each stop
# sits a fraction of an ATR beyond the structure the strategy trades, and the
# fraction is larger where the structure is tighter: a Bollinger squeeze is a
# narrow thing to hide behind, a swept extreme is already a wide excursion. The
# sizes were also chosen so that a structural stop LANDS inside §10's [$2, $5]
# band at XAUUSD's typical 60-minute ATR -- otherwise `stop_too_tight` refuses
# the entire archive and the strategies are untestable rather than untested.
# **They were fixed before the first backtest ran and are not tuned on results.**
# `walkforward.py` records them in the trial counter regardless.

# --------------------------------------------------------------------------
# Gates. TRACK_C_ENGINE §7, committed before the first backtest. A gate chosen
# after seeing an equity curve is not a gate.

[gates]
c1_min_funnel_events = 100     # C1: below this no parameter setting makes the spec testable
c2_min_ev_r = 0.0                # C2: EV per trade after cost must be positive. In R, not bp: the
                               # fills already carry the cost, and R and bp share a sign at zero
c3_min_pf = 1.4                # C3: Quant_trading G3, unchanged
c4_min_dsr = 0.0               # C4: deflated Sharpe above zero at the programme's trial count
c5_max_dd = 0.12               # C5: 12% of starting equity
c6_min_window_share = 0.80     # C6: 4 of 5 out-of-sample windows profitable
c7_worst_day_r = -2.0          # C7: worst day no worse than -2R
                               # C8 (holdout agreement) is a comparison, not a threshold

[walkforward]
train_m = 24                   # §14
val_m = 6                      # §14
roll_m = 3                     # §14
holdout_m = 12                 # §14's final year, opened ONCE
label_minutes = 90             # purge: the longest a Track C position can stay open
embargo_days = 1               # §14
